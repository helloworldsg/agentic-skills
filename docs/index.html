<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>The Agentic Blueprint</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --accent: #38bdf8;
      --accent-hover: #0ea5e9;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --shadow: rgba(0,0,0,0.5);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    /* Slide Stage */
    #stage {
      position: relative;
      width: 100%; height: 100vh; /* fallback */
      height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 52px 8px 64px;
    }
    .slide {
      position: absolute;
      inset: 52px 8px 64px;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transform: scale(0.96) translateY(8px);
      transition: opacity 0.3s ease, transform 0.3s ease;
      pointer-events: none;
      border-radius: 10px;
      overflow: hidden;
    }
    .slide.active {
      opacity: 1;
      transform: scale(1) translateY(0);
      pointer-events: auto;
      z-index: 2;
    }
    .slide img {
      display: block;
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      border-radius: 10px;
      box-shadow: 0 12px 40px var(--shadow);
    }

    /* Navigation Buttons */
    .nav-btn {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      width: 44px; height: 44px;
      border: none;
      border-radius: 50%;
      background: rgba(30,41,59,0.85);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      color: var(--text);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
      opacity: 0;
      transition: opacity 0.2s ease, background 0.2s ease, transform 0.2s ease;
      box-shadow: 0 4px 12px var(--shadow);
    }
    body:hover .nav-btn { opacity: 0.6; }
    .nav-btn:hover { opacity: 1 !important; background: var(--accent); color: #fff; }
    .nav-btn:active { transform: translateY(-50%) scale(0.92); }
    #prevBtn { left: 10px; }
    #nextBtn { right: 10px; }
    .nav-btn svg { width: 22px; height: 22px; fill: currentColor; }

    /* Bottom Bar */
    #bottomBar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: 52px;
      background: linear-gradient(to top, rgba(15,23,42,0.95), rgba(15,23,42,0));
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      z-index: 10;
      padding: 0 12px;
    }
    #counter {
      font-size: 13px;
      color: var(--muted);
      min-width: 50px;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }
    #dots {
      display: flex;
      gap: 6px;
      align-items: center;
      max-width: 60vw;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    #dots::-webkit-scrollbar { display: none; }
    .dot {
      flex-shrink: 0;
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--muted);
      opacity: 0.4;
      cursor: pointer;
      transition: all 0.25s ease;
      border: none;
      padding: 0;
    }
    .dot.active {
      opacity: 1;
      background: var(--accent);
      transform: scale(1.3);
    }
    .dot:hover { opacity: 0.8; }

    /* Thumbnails Toggle */
    #thumbToggle {
      position: fixed;
      bottom: 10px;
      left: 12px;
      z-index: 11;
      background: rgba(30,41,59,0.85);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border: none;
      border-radius: 8px;
      color: var(--text);
      padding: 7px 12px;
      font-size: 12px;
      cursor: pointer;
      opacity: 0.7;
      transition: opacity 0.2s, background 0.2s;
      box-shadow: 0 4px 12px var(--shadow);
    }
    #thumbToggle:hover { opacity: 1; background: var(--accent); color: #fff; }
    #thumbToggle:active { transform: scale(0.95); }

    /* Thumbnails Panel */
    #thumbPanel {
      position: fixed;
      top: 0; left: 0; bottom: 0;
      width: 200px;
      background: var(--panel);
      transform: translateX(-100%);
      transition: transform 0.3s ease;
      z-index: 20;
      overflow-y: auto;
      padding: 14px;
      box-shadow: 4px 0 24px var(--shadow);
      -webkit-overflow-scrolling: touch;
    }
    #thumbPanel.open { transform: translateX(0); }
    #thumbPanel h3 {
      margin: 0 0 14px;
      font-size: 13px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .thumb {
      width: 100%;
      aspect-ratio: 16/9;
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 10px;
      cursor: pointer;
      border: 2px solid transparent;
      transition: border-color 0.2s, transform 0.2s;
      background: var(--bg);
    }
    .thumb img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
    }
    .thumb:hover { transform: scale(1.02); }
    .thumb.active { border-color: var(--accent); }

    /* Overlay */
    #overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
      z-index: 15;
    }
    #overlay.visible { opacity: 1; pointer-events: auto; }

    /* Top title */
    #topBar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 48px;
      background: linear-gradient(to bottom, rgba(15,23,42,0.9), rgba(15,23,42,0));
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
      pointer-events: none;
    }
    #topBar h1 {
      margin: 0;
      font-size: 15px;
      font-weight: 500;
      color: var(--muted);
      letter-spacing: 0.02em;
    }

    /* Keyboard hint */
    #hint {
      position: fixed;
      bottom: 62px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--panel);
      color: var(--muted);
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 11px;
      opacity: 0;
      transition: opacity 1s ease 2s;
      z-index: 5;
      pointer-events: none;
    }
    body:hover #hint { opacity: 0.5; }

    /* ========================
       DESKTOP OVERRIDES
       ======================== */
    @media (min-width: 769px) {
      #stage { padding: 60px 80px 80px; }
      .slide { inset: auto; max-width: 100%; max-height: 100%; border-radius: 12px; }
      .slide img { max-height: calc(100vh - 140px); border-radius: 12px; }
      .nav-btn { width: 48px; height: 48px; }
      #prevBtn { left: 18px; }
      #nextBtn { right: 18px; }
      #thumbPanel { width: 220px; padding: 16px; }
      #bottomBar { height: 60px; padding: 0 20px; }
      #thumbToggle { bottom: 14px; left: 18px; padding: 8px 14px; font-size: 13px; }
      #counter { font-size: 14px; min-width: 60px; }
      #topBar { height: 52px; }
      #topBar h1 { font-size: 16px; }
      #hint { bottom: 70px; font-size: 12px; padding: 6px 14px; }
    }

    /* Touch-device fallback: always show nav buttons at low opacity */
    @media (hover: none) {
      .nav-btn { opacity: 0.55; }
    }
  </style>
</head>
<body>

  <div id="topBar"><h1>The Agentic Blueprint</h1></div>

  <div id="stage"></div>

  <button id="prevBtn" class="nav-btn" aria-label="Previous slide">
    <svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
  </button>
  <button id="nextBtn" class="nav-btn" aria-label="Next slide">
    <svg viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
  </button>

  <div id="overlay"></div>

  <button id="thumbToggle">Thumbnails</button>
  <div id="thumbPanel">
    <h3>Slides</h3>
    <div id="thumbs"></div>
  </div>

  <div id="bottomBar">
    <span id="counter">1 / 15</span>
    <div id="dots"></div>
  </div>

  <div id="hint">← → to navigate · Esc for overview</div>

  <script>
    const TOTAL = 15;
    const stage = document.getElementById('stage');
    const counter = document.getElementById('counter');
    const dotsContainer = document.getElementById('dots');
    const thumbsContainer = document.getElementById('thumbs');
    const thumbPanel = document.getElementById('thumbPanel');
    const overlay = document.getElementById('overlay');
    let current = 0;

    function imgPath(i) {
      return `images/slide_${String(i+1).padStart(2,'0')}.jpg`;
    }

    // Build slides
    for (let i = 0; i < TOTAL; i++) {
      const slide = document.createElement('div');
      slide.className = 'slide' + (i === 0 ? ' active' : '');
      slide.innerHTML = `<img src="${imgPath(i)}" alt="Slide ${i+1}" loading="${i < 3 ? 'eager' : 'lazy'}">`;
      stage.appendChild(slide);

      // Dot
      const dot = document.createElement('button');
      dot.className = 'dot' + (i === 0 ? ' active' : '');
      dot.ariaLabel = `Go to slide ${i+1}`;
      dot.onclick = () => goTo(i);
      dotsContainer.appendChild(dot);

      // Thumbnail
      const thumb = document.createElement('div');
      thumb.className = 'thumb' + (i === 0 ? ' active' : '');
      thumb.innerHTML = `<img src="${imgPath(i)}" alt="Thumb ${i+1}" loading="lazy">`;
      thumb.onclick = () => { goTo(i); closeThumbs(); };
      thumbsContainer.appendChild(thumb);
    }

    const slides = document.querySelectorAll('.slide');
    const dots = document.querySelectorAll('.dot');
    const thumbs = document.querySelectorAll('.thumb');

    function update() {
      slides.forEach((s, i) => s.classList.toggle('active', i === current));
      dots.forEach((d, i) => d.classList.toggle('active', i === current));
      thumbs.forEach((t, i) => t.classList.toggle('active', i === current));
      counter.textContent = `${current + 1} / ${TOTAL}`;

      // Scroll active thumb into view
      if (thumbPanel.classList.contains('open')) {
        thumbs[current].scrollIntoView({ behavior: 'smooth', block: 'center' });
      }

      // Preload neighbors
      [current - 1, current + 1].forEach(idx => {
        if (idx >= 0 && idx < TOTAL) {
          const img = slides[idx].querySelector('img');
          if (img.loading === 'lazy') img.loading = 'eager';
        }
      });
    }

    function goTo(index) {
      if (index < 0 || index >= TOTAL) return;
      current = index;
      update();
    }
    function next() { if (current < TOTAL - 1) goTo(current + 1); }
    function prev() { if (current > 0) goTo(current - 1); }

    function openThumbs() { thumbPanel.classList.add('open'); overlay.classList.add('visible'); }
    function closeThumbs() { thumbPanel.classList.remove('open'); overlay.classList.remove('visible'); }

    // Click/tap events
    document.getElementById('prevBtn').onclick = prev;
    document.getElementById('nextBtn').onclick = next;
    document.getElementById('thumbToggle').onclick = openThumbs;
    overlay.onclick = closeThumbs;

    // Keyboard
    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') { e.preventDefault(); next(); }
      else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); prev(); }
      else if (e.key === 'Home') { e.preventDefault(); goTo(0); }
      else if (e.key === 'End') { e.preventDefault(); goTo(TOTAL - 1); }
      else if (e.key === 'Escape') { closeThumbs(); }
      else if (e.key.toLowerCase() === 't') { thumbPanel.classList.contains('open') ? closeThumbs() : openThumbs(); }
    });

    /* ========== Touch Swipe ========== */
    let touchStartX = 0, touchStartY = 0, touchStartTime = 0;
    let isSwiping = false;

    document.addEventListener('touchstart', e => {
      if (e.touches.length !== 1) return;
      touchStartX = e.touches[0].screenX;
      touchStartY = e.touches[0].screenY;
      touchStartTime = Date.now();
      isSwiping = false;
    }, { passive: true });

    document.addEventListener('touchmove', e => {
      if (e.touches.length !== 1) return;
      const dx = e.touches[0].screenX - touchStartX;
      const dy = e.touches[0].screenY - touchStartY;
      // Determine if this is a horizontal swipe
      if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 10) {
        isSwiping = true;
      }
    }, { passive: true });

    document.addEventListener('touchend', e => {
      if (!isSwiping) return;
      const dx = e.changedTouches[0].screenX - touchStartX;
      const dt = Date.now() - touchStartTime;
      const velocity = Math.abs(dx) / (dt || 1);
      // Swipe if distance > 40px OR velocity-based quick flick
      if (Math.abs(dx) > 40 || (Math.abs(dx) > 20 && velocity > 0.5)) {
        dx < 0 ? next() : prev();
      }
      isSwiping = false;
    }, { passive: true });

    /* ========== Tap zones for navigation ========== */
    // Left 25% of screen = prev, right 25% = next (only on touch devices)
    const isTouch = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
    if (isTouch) {
      stage.addEventListener('touchend', e => {
        if (isSwiping) return; // ignore if it was a swipe
        const x = e.changedTouches[0].clientX;
        const w = window.innerWidth;
        if (x < w * 0.22) prev();
        else if (x > w * 0.78) next();
      }, { passive: true });
    }

    // Preload first 3 images
    for (let i = 0; i < Math.min(3, TOTAL); i++) {
      const link = document.createElement('link');
      link.rel = 'preload'; link.as = 'image'; link.href = imgPath(i);
      document.head.appendChild(link);
    }
  </script>
</body>
</html>
